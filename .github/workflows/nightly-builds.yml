name: Nightly Builds

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8

    - uses: actions/setup-python@v5 
      with:
        python-version: '3.11' 

    - name: python .\publish.py
      run: |
        $nightlyVersion = [System.DateTimeOffset]::UtcNow.ToOffset([System.TimeSpan]::FromHours(8)).ToString("yyyyMMddHHmmss")
        "NIGHTLY_VERSION=$nightlyVersion" >> $env:GITHUB_ENV
        python .\publish.py --version-suffix="-nightly+$nightlyVersion"

    - name: upload nightly build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create -R "jasonz3157/LGSTrayBattery" `
          $env:NIGHTLY_VERSION `
          --target "$env:GITHUB_SHA" `
          (get-item ./bin/Release/publish/*.zip)